name: Build Tactical Compass APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (required by Capacitor 6)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build web app (bundled into the APK, so it works offline)
        run: |
          npm install
          npx vite build

      - name: Add Android platform
        run: npx cap add android

      - name: Apply app icons and permissions
        run: |
          cp -r resources/android/res/. android/app/src/main/res/
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          lines = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-feature android:name="android.hardware.camera" android:required="false" />',
              '<uses-feature android:name="android.hardware.location.gps" android:required="false" />',
              '<uses-feature android:name="android.hardware.sensor.compass" android:required="false" />',
          ]
          add = chr(10).join('    ' + l for l in lines if l.split('"')[1] not in s) + chr(10)
          s = s.replace('</manifest>', add + '</manifest>')
          open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -q ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml
          grep -q android.permission.CAMERA android/app/src/main/AndroidManifest.xml

      - name: Compile APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TacticalCompass.apk

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TacticalCompass-APK
          path: TacticalCompass.apk

      - name: Publish as a GitHub Release (easy phone download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${{ github.run_number }}" TacticalCompass.apk \
            --target "$GITHUB_SHA" \
            --title "Tactical Compass APK #${{ github.run_number }}" \
            --notes "Debug-signed APK. Works fully offline. Download TacticalCompass.apk on your Android phone and install it."
